<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d667a;--bd:#dde1ec;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:15px}.sc{font-size:14px;color:var(--mu)}
main{max-width:760px;margin:0 auto;padding:16px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.n{font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.04em}

.o:hover:not(:disabled){border-color:var(--ac)}
.o:disabled{cursor:default}.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.e{display:none;margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--mu)}
.q.done .e{display:block}
#res{display:none;text-align:center;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:20px;margin-bottom:14px}
#res.show{display:block}#res strong{font-size:28px}
button.r{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;margin-top:8px}
</style></head><body>

["Байқау тестті ЖАРАМСЫЗ ететін жағдай:",["Шығармашылық пәнді 35 минутта аяқтады","Пәндерді қате таңдады","Негізгі пәнді 1,5 сағат тапсырды","Уақыт алдын ала хабарланды"],1,"Пәндерді қате таңдау немесе толық тапсырмау тестті жарамсыз етеді."],
["Байқау тест платформа тапсырмасы мерзімінде орындалды, бірақ 40 минут белсенді отырды. Нәтиже?",["Толық есептеледі","Толық болып есептелмейді — 1 сағаттан артық белсенділік керек","Жартылай есептеледі","Куратор растаса есептеледі"],1,"Кемінде 1 сағаттан артық белсенді отыру міндетті."],

let ans=0,ok=0;
function init(){ans=0;ok=0;document.getElementById('res').className='';upd();

D.forEach((d,i)=>{const q=document.createElement('div');q.className='q';
q.innerHTML='<div class="n">СҰРАҚ '+(i+1)+' / '+D.length+'</div><h3></h3><div class="e"></div>';
q.querySelector('h3').textContent=d[0];q.querySelector('.e').textContent='Түсіндірме: '+d[3];

d[1].forEach((t,j)=>{const b=document.createElement('button');b.className='o';b.textContent=t;

function upd(){document.getElementById('sc').textContent=ans+' / '+D.length+' жауап · '+ok+' дұрыс'}

init();
